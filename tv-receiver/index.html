<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NERO Music TV | Protótipo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:24px Arial,sans-serif}main{padding:5%}header{font-size:24px;letter-spacing:3px;color:#d7d7d7}h1{font-size:46px;margin:24px 0 8px}p{color:#bbb;line-height:1.5;margin:8px 0 18px}#screen{width:72%;max-width:960px;margin:28px 0;background:#050505}#screen iframe{display:block;width:100%;height:480px;border:0}#state{color:#c5d5ea;font-size:20px}button{padding:14px 22px;background:#e8e8e8;color:#111;border:0;font-size:22px}button:focus{outline:4px solid #80aaff}input{font-size:24px;padding:12px;width:280px}small{font-size:16px;color:#aaa}
</style>
</head>
<body><main>
<header>NERO MUSIC / TV</header>
<h1 id="title">Receptor experimental</h1>
<p id="artist"></p><p id="state" role="status">Informe o identificador do vídeo autorizado.</p>
<form id="form"><label for="videoId">ID do vídeo </label><input id="videoId" maxlength="11" autocomplete="off"><button type="submit">Reproduzir</button></form>
<div id="screen"><div id="player"></div></div>
<section id="queueControls" aria-label="Fila de reprodução" style="display:none"><p id="queueState" role="status"></p><button id="prev" type="button">Anterior</button> <button id="play" type="button">Reproduzir</button> <button id="pause" type="button">Pausar</button> <button id="next" type="button">Próxima</button></section><p id="progress" aria-live="off">00:00 / 00:00</p><small>Reprodução incorporada pelo YouTube. Protótipo gratuito de compatibilidade; não é uma sessão de espelhamento.</small>
</main>
<script>
(function(){
"use strict";
var player=null, ready=false, pending=null, queue=null, queueIndex=0, queueStart=0, state=document.getElementById("state");
function query(name){
 var pattern=new RegExp("(?:^|[?&])"+name+"=([^&]*)");
 var match=pattern.exec(location.hash.replace(/^#/,"?"))||pattern.exec(location.search);
 try{return match?decodeURIComponent(match[1].replace(/\+/g," ")).slice(0,180):"";}catch(e){return "";}
}
var title=query("title"), artist=query("artist");
var start=Math.min(86400,Math.max(0,Math.floor(Number(query("t"))||0)));
if(title)document.getElementById("title").textContent=title;
if(artist)document.getElementById("artist").textContent=artist;
function clock(value){
 var sec=Math.max(0,Math.floor(Number(value)||0));
 var min=Math.floor(sec/60), rem=sec%60;
 return (min<10?"0":"")+min+":"+(rem<10?"0":"")+rem;
}
setInterval(function(){
 if(!ready||!player)return;
 try{document.getElementById("progress").textContent=clock(player.getCurrentTime())+" / "+clock(player.getDuration());}catch(e){}
},1000);
var valid=function(id){return /^[A-Za-z0-9_-]{11}$/.test(id);};
function status(s){state.textContent=s;}
function readQueue(){
 var match=/(?:^|[?&])q=([^&]*)/.exec(location.hash.replace(/^#/,"?"));
 if(!match||match[1].length>2400)return null;
 try{
  var ids=decodeURIComponent(match[1]).split(",");
  if(ids.length<1||ids.length>100)return null;
  for(var i=0;i<ids.length;i++)if(!valid(ids[i]))return null;
  var indexRaw=query("i");
  if(indexRaw&&!/^\d{1,3}$/.test(indexRaw))return null;
  var index=Number(indexRaw||0);
  if(index<0||index>=ids.length)return null;
  return {ids:ids,index:index};
 }catch(e){return null;}
}
function updateQueue(){
 if(!queue||!ready||!player)return;
 try{
  var index=player.getPlaylistIndex();
  if(typeof index==="number"&&index>=0&&index<queue.length)document.getElementById("queueState").textContent="Faixa "+(index+1)+" de "+queue.length;
 }catch(e){}
}
function cueQueue(){
 if(!ready||!queue)return;
 try{
  player.cuePlaylist({playlist:queue,index:queueIndex,startSeconds:queueStart});
  status("Fila preparada. Pressione Reproduzir na TV.");
 }catch(e){status("Não foi possível preparar a fila no player oficial.");}
}
function queueAction(method){
 if(!ready||!queue||!player)return;
 try{
  var index=player.getPlaylistIndex();
  if(method==="nextVideo"&&(index<0||index>=queue.length-1))return;
  if(method==="previousVideo"&&index<=0)return;
  player[method]();
 }catch(e){status("Comando indisponível no player desta TV.");}
}
document.getElementById("prev").onclick=function(){queueAction("previousVideo");};
document.getElementById("play").onclick=function(){queueAction("playVideo");};
document.getElementById("pause").onclick=function(){queueAction("pauseVideo");};
document.getElementById("next").onclick=function(){queueAction("nextVideo");};
function load(id){
 if(!valid(id)){status("Identificador inválido.");return;}
 pending=id;
 if(id!==query("v")){document.getElementById("title").textContent="NERO Music TV";document.getElementById("artist").textContent="";}
 if(!ready){status("Aguardando o player oficial…");return;}
 try{player.loadVideoById({videoId:id,startSeconds:id===query("v")?start:0});status("Solicitando reprodução…");}
 catch(e){status("Não foi possível solicitar reprodução.");}
}
document.getElementById("form").onsubmit=function(e){
 if(e&&e.preventDefault)e.preventDefault();
 load(document.getElementById("videoId").value);
 return false;
};
window.onYouTubeIframeAPIReady=function(){
 try {
 player=new YT.Player("player",{height:"480",width:"854",playerVars:{controls:1,autoplay:0,playsinline:1,origin:location.protocol+"//"+location.host},events:{
 onReady:function(){ready=true;status("Receptor pronto. Selecione o vídeo.");if(queue)cueQueue();else if(pending)load(pending);},
 onStateChange:function(e){
 var messages={"-1":"Aguardando reprodução.","0":"Reprodução encerrada.","1":"Reprodução confirmada pelo player.","2":"Pausado.","3":"Carregando…","5":"Vídeo preparado."};
 if(Object.prototype.hasOwnProperty.call(messages,String(e.data)))status(messages[String(e.data)]);updateQueue();
 },
 onError:function(e){status("O player oficial não conseguiu reproduzir este vídeo (código "+String(e.data)+").");},
 onAutoplayBlocked:function(){status("A TV bloqueou a reprodução automática. Use o botão do player.");}
 }});
 }catch(e){status("Player incompatível com este navegador.");}
};
var initialQueue=readQueue();
if(initialQueue){queue=initialQueue.ids;queueIndex=initialQueue.index;queueStart=start;document.getElementById("form").style.display="none";document.getElementById("queueControls").style.display="block";document.getElementById("title").textContent="NERO Connect TV";document.getElementById("artist").textContent="Fila de reprodução";document.getElementById("queueState").textContent="Faixa "+(queueIndex+1)+" de "+queue.length;}
var initialId=query("v");
if(!queue&&valid(initialId)){document.getElementById("videoId").value=initialId;pending=initialId;document.getElementById("form").style.display="none";}
var script=document.createElement("script");script.src="https://www.youtube.com/iframe_api";script.onerror=function(){status("Não foi possível carregar o player oficial. Verifique a compatibilidade do navegador e a rede.");};
document.head.appendChild(script);
setTimeout(function(){if(!ready)status("O player ainda não respondeu. Navegadores antigos podem ser incompatíveis.");},20000);
})();
</script></body></html>
