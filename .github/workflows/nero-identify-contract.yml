name: NERO Identify - provider contract
on:
  push:
    branches: ['feature/nero-ai-2']
    paths: ['server/identify/**', '.github/workflows/nero-identify-contract.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/identify/audd.test.mjs
