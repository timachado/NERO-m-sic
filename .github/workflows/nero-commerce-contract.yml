name: NERO isolated commerce contract
on:
  push:
    branches: [test/nero-commercial-contract, feat/nero-connect, experiment/nero-together-sync]
    paths:
      - 'supabase/tests/**'
      - 'supabase/deployed/**'
      - 'supabase/setup/nero_commerce_snapshot*'
      - 'supabase/setup/nero_together_sync_v2_draft.sql'
      - '.github/workflows/nero-commerce-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: nero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated SQL contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: disposable_test_only
          PGDATABASE: nero_test
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/commerce_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/deployed/20261126072708_nero_isolated_cloud_and_plan_read_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/deployed/20261126072734_nero_trial_and_together_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/setup/nero_commerce_snapshot_draft.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/setup/nero_commerce_snapshot_permissions_test.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/commerce_contract.sql

      - name: Run isolated Together synchronization contract
        if: github.ref == 'refs/heads/experiment/nero-together-sync'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: disposable_test_only
          PGDATABASE: nero_test
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/setup/nero_together_sync_v2_draft.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/together_sync_contract.sql
