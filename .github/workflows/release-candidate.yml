name: NERO signed release candidate
on:
  push:
    branches:
      - feat/nero-connect
      - experiment/nero-together-sync
      - candidate/nero-player-210
      - candidate/nero-player-211
      - candidate/nero-player-212
      - candidate/nero-player-213
      - candidate/nero-player-214
      - candidate/nero-player-215
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nero-signed-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    if: github.ref == 'refs/heads/candidate/nero-player-215' || github.ref == 'refs/heads/candidate/nero-player-214' || github.ref == 'refs/heads/candidate/nero-player-213' || github.ref == 'refs/heads/candidate/nero-player-212' || github.ref == 'refs/heads/candidate/nero-player-211' || github.ref == 'refs/heads/candidate/nero-player-210' || github.ref == 'refs/heads/feat/nero-connect' || github.ref == 'refs/heads/experiment/nero-together-sync' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment: nero-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and install exclusive NERO Firebase client
        env:
          FIREBASE_CONFIG: ${{ secrets.NERO_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_CONFIG" || { echo "::error::NERO_GOOGLE_SERVICES_JSON missing"; exit 1; }
          umask 077
          printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          python3 - <<'PY'
          import json
          with open('app/google-services.json') as f: row=json.load(f)
          assert row['project_info']['project_id']=='nero-music-c8654', 'Wrong Firebase project'
          clients=[c for c in row['client'] if c['client_info']['android_client_info']['package_name']=='br.com.timachado.neromusic']
          assert len(clients)==1, 'Wrong Firebase Android package'
          assert clients[0]['client_info']['mobilesdk_app_id']=='1:199789455133:android:0505ae7096dec9a9d263f4', 'Wrong Firebase app'
          print('NERO Firebase project and Android application verified.')
          PY
      - name: Build unsigned release, lint and unit tests
        env:
          NERO_SUPABASE_URL: ${{ vars.NERO_SUPABASE_URL }}
          NERO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NERO_SUPABASE_PUBLISHABLE_KEY }}
          NERO_GOOGLE_CLIENT_ID: ${{ vars.NERO_GOOGLE_CLIENT_ID }}
          NERO_SHARE_HOST: ${{ vars.NERO_SHARE_HOST }}
        run: |
          set -euo pipefail
          for field in NERO_SUPABASE_URL NERO_SUPABASE_PUBLISHABLE_KEY NERO_GOOGLE_CLIENT_ID; do
            test -n "${!field}" || { echo "::error::Missing auth configuration: $field"; exit 1; }
          done
          gradle :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest --no-daemon
      - name: Sign and verify candidate
        env:
          NERO_STORE_B64: ${{ secrets.NERO_RELEASE_KEYSTORE_B64 }}
          NERO_STORE_PASSWORD: ${{ secrets.NERO_RELEASE_STORE_PASSWORD }}
          NERO_KEY_ALIAS: ${{ secrets.NERO_RELEASE_KEY_ALIAS }}
          NERO_KEY_PASSWORD: ${{ secrets.NERO_RELEASE_KEY_PASSWORD }}
          NERO_CERT_SHA256: ${{ secrets.NERO_RELEASE_CERT_SHA256 || vars.NERO_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for field in NERO_STORE_B64 NERO_STORE_PASSWORD NERO_KEY_ALIAS NERO_KEY_PASSWORD NERO_CERT_SHA256; do
            test -n "${!field}" || { echo "Missing release signing configuration: $field"; exit 1; }
          done
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$NERO_STORE_B64" | base64 --decode > "$work/release.jks"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          source="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$source"
          mkdir -p dist
          "$tools/zipalign" -P 16 -f 4 "$source" "$work/aligned.apk"
          "$tools/apksigner" sign --ks "$work/release.jks" --ks-key-alias "$NERO_KEY_ALIAS" --ks-pass env:NERO_STORE_PASSWORD --key-pass env:NERO_KEY_PASSWORD --out dist/NERO-Music-release-candidate.apk "$work/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs dist/NERO-Music-release-candidate.apk > "$work/verify.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$work/verify.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected="$(printf '%s' "$NERO_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$expected" =~ ^[a-f0-9]{64}$ && "$actual" == "$expected" ]] || { echo "Release certificate mismatch"; exit 1; }
          test "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$work/verify.txt")" -eq 1
          "$tools/zipalign" -c -P 16 4 dist/NERO-Music-release-candidate.apk
          "$tools/aapt" dump badging dist/NERO-Music-release-candidate.apk > "$work/badging.txt"
          grep -q "^package: name='br.com.timachado.neromusic'" "$work/badging.txt"
          if grep -q '^application-debuggable' "$work/badging.txt"; then echo "Debug APK rejected"; exit 1; fi
          cp "$work/verify.txt" dist/signature-report.txt
          grep '^package:' "$work/badging.txt" > dist/version.txt
          printf 'commit=%s\n' "$GITHUB_SHA" >> dist/version.txt
          (cd dist && sha256sum NERO-Music-release-candidate.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: nero-signed-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7
