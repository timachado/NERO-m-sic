name: NERO signed release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: nero-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require configured Firebase client
        env:
          FIREBASE_CONFIG: ${{ secrets.NERO_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_CONFIG" || { echo "Firebase client configuration missing"; exit 1; }
          umask 077
          printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
      - name: Build unsigned release and lint
        run: gradle :app:assembleRelease :app:lintRelease --no-daemon
      - name: Sign and verify candidate
        env:
          NERO_STORE_B64: ${{ secrets.NERO_RELEASE_KEYSTORE_B64 }}
          NERO_STORE_PASSWORD: ${{ secrets.NERO_RELEASE_STORE_PASSWORD }}
          NERO_KEY_ALIAS: ${{ secrets.NERO_RELEASE_KEY_ALIAS }}
          NERO_KEY_PASSWORD: ${{ secrets.NERO_RELEASE_KEY_PASSWORD }}
          NERO_CERT_SHA256: ${{ vars.NERO_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for field in NERO_STORE_B64 NERO_STORE_PASSWORD NERO_KEY_ALIAS NERO_KEY_PASSWORD NERO_CERT_SHA256; do
            test -n "${!field}" || { echo "Missing release signing configuration: $field"; exit 1; }
          done
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$NERO_STORE_B64" | base64 --decode > "$work/release.jks"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          source="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$source"
          mkdir -p dist
          "$tools/zipalign" -P 16 -f 4 "$source" "$work/aligned.apk"
          "$tools/apksigner" sign --ks "$work/release.jks" --ks-key-alias "$NERO_KEY_ALIAS" --ks-pass env:NERO_STORE_PASSWORD --key-pass env:NERO_KEY_PASSWORD --out dist/NERO-Music-release-candidate.apk "$work/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs dist/NERO-Music-release-candidate.apk > "$work/verify.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$work/verify.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected="$(printf '%s' "$NERO_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$expected" =~ ^[a-f0-9]{64}$ && "$actual" == "$expected" ]] || { echo "Release certificate mismatch"; exit 1; }
          test "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$work/verify.txt")" -eq 1
          "$tools/zipalign" -c -P 16 4 dist/NERO-Music-release-candidate.apk
          "$tools/aapt" dump badging dist/NERO-Music-release-candidate.apk > "$work/badging.txt"
          grep -q "^package: name='br.com.timachado.neromusic'" "$work/badging.txt"
          if grep -q '^application-debuggable' "$work/badging.txt"; then echo "Debug APK rejected"; exit 1; fi
          cp "$work/verify.txt" dist/signature-report.txt
          grep '^package:' "$work/badging.txt" > dist/version.txt
          printf 'commit=%s\n' "$GITHUB_SHA" >> dist/version.txt
          (cd dist && sha256sum NERO-Music-release-candidate.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: nero-signed-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7
