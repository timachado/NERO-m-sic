name: NERO sharing security tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firebase/firestore.rules'
      - 'firebase/sharing.rules.test.mjs'
      - 'firebase/package.json'
      - 'firebase/emulator.json'
      - '.github/workflows/sharing-security.yml'
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npx --no-install firebase emulators:exec --config emulator.json --project demo-nero-share --only firestore "node --test sharing.rules.test.mjs"
