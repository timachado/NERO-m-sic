name: NERO Lyrics AI - isolated verification
on:
  push:
    branches: ['feature/nero-ai-lyrics']
    paths: ['app/**','server/lyrics/**','.github/workflows/nero-lyrics-ai-check.yml']
permissions:
  contents: read
jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/lyrics/openai.test.mjs
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test without activation or release signing
        env:
          NERO_LYRICS_AI_ENABLED: 'false'
        run: gradle :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest --no-daemon
